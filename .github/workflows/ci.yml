name: CI Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run core, UI, theme, and script library test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_upgrades_batch.py tests/test_ui_consistency_and_resizing.py tests/test_no_inline_stylesheets.py tests/test_semantic_colors.py tests/test_chrome_colors.py tests/test_phosphor_themes.py tests/test_chart_palette.py tests/test_script_library.py tests/test_table_ui.py -v
