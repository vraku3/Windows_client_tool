[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winclienttool"
description = "Windows 11 optimization and system diagnostics utility"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyQt6==6.11.0",
    "PyQt6-Qt6==6.11.0",
    "psutil>=5.9",
    "pywin32>=306",
    "WMI>=1.5.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.2", "pytest-xdist>=3.5",
       "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "scratchpad"]

[tool.ruff.lint]
# Deliberately narrow to start. The tree is 92k lines written without a
# linter; turning on the full default set produces thousands of findings and
# teaches everyone to ignore the tool. Each later task may widen this.
#   E4 imports, E7 statements, E9 syntax/IO errors, F pyflakes, W6 deprecation
select = ["E4", "E7", "E9", "F", "W6"]
ignore = [
    # cleanup_scanner/__init__.py re-exports eight modules with `import *`.
    # That is audit #19, and it has its own task — until then the star
    # imports are known, not accidental.
    "F403",
    "F405",
]

[tool.ruff.lint.per-file-ignores]
"src/modules/cleanup/cleanup_scanner/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# Advisory for now: 907 of 4,744 functions have no return annotation.
# Tightening this is a later task's job, not this one's.
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# --timeout is a safety net against a genuine hang eating a whole CI job
# silently. It uses pytest-timeout's "thread" method, which can only
# interrupt regular Python execution — a test blocked in a native Qt call
# (a stray dialog .exec()) is not preempted by it. Still worth having for
# the commoner case: an accidental infinite loop, a background op that
# never returns.
#
# These flags live here rather than in the CI workflow so that `pytest` is
# the same command everywhere. It was not: CI passed --timeout=120 while
# pytest-timeout was absent from the local venv, so the identical command
# exited 4 here with "unrecognized arguments".
#
# --basetemp is the load-bearing flag. pytest's default temp root is
# %TEMP%\pytest-of-<user>, and it keeps a `pytest-current` symlink there
# pointing at the newest run. On this machine that symlink cannot be
# stat'd at all:
#
#     PermissionError: [WinError 5] Access is denied:
#     ...\Temp\pytest-of-iorda\pytest-current
#
# and `cleanup_dead_symlinks` walks it from pytest_sessionfinish — after
# the last test, before the summary is printed. So a full run ended in a
# traceback with no pass/fail line and no failure details: the suite's
# real state was invisible, and the 5 failures it was hiding had been
# there for some time. Pointing basetemp somewhere else means that
# directory is never walked.
#
# It must be a directory whose PARENT already exists: pytest creates the
# basetemp itself but not the path above it. `build/pytest-tmp` looked fine
# for months because PyInstaller creates `build/` and every dev machine has
# one -- and `build/` is gitignored, so a fresh CI checkout does not. Every
# tmp_path test on the runner died with
#
#     FileNotFoundError: [WinError 3] The system cannot find the path
#     specified: 'D:\a\Windows_client_tool\Windows_client_tool\build\pytest-tmp'
#
# and CI was red from the day this setting landed while the identical
# command stayed green locally. The repo root always exists.
#
# NOTE: pytest empties basetemp at the start of every run, and two pytest
# processes sharing one basetemp will clobber each other. Pass an explicit
# --basetemp if you need to run two at once.
# -m 'not real_machine' keeps the default run about the code. The
# excluded tests are not disabled — CI runs them as a separate,
# non-gating step, and `pytest -m real_machine` runs them here.
addopts = "-q --timeout=120 --basetemp=build/pytest-tmp -m 'not real_machine'"
# Belt and braces: don't accumulate numbered run directories either.
tmp_path_retention_policy = "none"
markers = [
    "slow: takes seconds, not milliseconds",
    "real_machine: reads or writes the actual machine (WMI, registry, services, live font metrics) rather than a fixture — excluded from the default run because it fails for environmental rather than code reasons",
    "needs_admin: requires an elevated process; skipped otherwise",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# Not a gate. There is no baseline to hold yet, and a failing threshold on
# the first run teaches everyone to pass --no-cov.
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
